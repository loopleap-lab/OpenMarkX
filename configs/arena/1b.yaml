# The 1B leaderboard: every registered method on Llama-3.2-1B.   openmarkx bench configs/arena/1b.yaml
base: llama-3.2-1b
methods:
  - openmark
  - openmark-coopt-c100
  - openmark-full-b01
  - gaussmark
  - markllm-unigram-d
  - markllm-kgw-d
  - markllm-sweet-d
  - markllm-ewd-d
  - markllm-morphmark-d
  - markllm-expedit-d
  # These teachers are not learned into 1B weights (TPR at 1% FPR <= 0.03 after 1500 steps; DIP still 0.02 at 3000),
  # so edits and forgery have nothing to measure: learn only.
  - {method: markllm-exp-d, steps: [learn]}
  - {method: markllm-unbiased-d, steps: [learn]}
  - {method: markllm-synthid-d, steps: [learn]}
  - {method: markllm-pf-d, steps: [learn]}
  - {method: markllm-dip-d, steps: [learn]}
  - {method: markllm-itsedit-d, steps: [learn]}
