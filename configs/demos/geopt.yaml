# Physics: PRO on GeoPT (aircraft surface fields), last night's sweep s1_e02: the mark written into the last layer in
# closed form (edit_last), no gradient steps. Needs the GeoPT repo: export OMX_GEOPT_DIR=<GeoPT checkout>.
model:
  name: geopt
  ckpt: $OMX_GEOPT_DIR/checkpoints/craft_geopt_8layers.pt
  data: $OMX_DATA/geopt/aircraft_npys
scheme:
  name: ripple
  params: {eps: 0.02, output_scale: 1.0, m: 32, n_wrong: 200}
imprint:
  edit_last: true
  phases:
    - {steps: 0, lr: 1.0e-5, trainable: full}
detect: {fpr: 0.01, null: wrong_keys}
edits: ["finetune:steps=200,lr=1e-4", "finetune:steps=2000,lr=1e-4"]   # 2 and 20 epochs over the 100 training cases
quality: rel_l2
out: $OMX_RUNS/demos/geopt
