[project]
name = "openmarkx"
version = "0.1.0"
description = "An ecosystem for watermarking open-source LLMs: learn a text watermark into the weights, edit, detect."
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=4.46", "peft>=0.13", "datasets", "scikit-learn", "scipy", "pyyaml",
                "bitsandbytes", "jieba", "nltk"]

[project.optional-dependencies]
test = ["pytest", "pillow"]
vision = ["pillow"]            # vlm and taming adapters: images in and out

[project.scripts]
openmarkx = "openmarkx.cli:main"
markweightx = "openmarkx.cli:main"      # the old name, kept as an alias

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs openmarkx check end to end (minutes)"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openmarkx*", "markweightx*"]   # markweightx: a shim for code written before the rename

[tool.setuptools.package-data]
"openmarkx" = ["app.html"]
"openmarkx.third_party.pro" = ["*.pth", "LICENSE"]
